[package]
name = "nix-pins"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
prodash = { version = "31", default-features = false, features = ["progress-tree", "render-line", "render-line-crossterm", "render-line-autoconfigure", "unit-bytes", "unit-human"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
unicode-width = "0.2"

[profile.release]
strip = true
